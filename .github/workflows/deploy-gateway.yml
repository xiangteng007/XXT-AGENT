name: Deploy OpenClaw Gateway


on:
  push:
    branches: [main]
    paths:
      - 'services/openclaw-gateway/**'
      - 'packages/types/**'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even without path changes'
        type: boolean
        default: false


env:
  PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  REGION: asia-east1
  SERVICE_NAME: openclaw-gateway
  IMAGE: asia-east1-docker.pkg.dev/${{ secrets.FIREBASE_PROJECT_ID }}/openclaw/gateway


jobs:
  typecheck-test:
    name: TypeScript & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - uses: actions/setup-node@v4
        with:
          node-version: '20'


      - name: Install pnpm
        uses: pnpm/action-setup@v4


      - name: Install dependencies
