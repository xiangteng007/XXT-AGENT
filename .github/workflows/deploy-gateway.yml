name: Deploy OpenClaw Gateway

on:
  push:
    branches: [main]
    paths:
      - 'services/openclaw-gateway/**'
      - 'packages/types/**'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even without path changes'
        type: boolean
        default: false

env:
  PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  REGION: asia-east1
  SERVICE_NAME: openclaw-gateway
  IMAGE: asia-east1-docker.pkg.dev/${{ secrets.FIREBASE_PROJECT_ID }}/openclaw/gateway

jobs:
  typecheck-test:
    name: TypeScript & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @xxt-agent/types
        working-directory: packages/types
        run: pnpm build

      - name: "Run Unit Tests (D-02)"
        working-directory: services/openclaw-gateway
        run: pnpm test:unit

      - name: TypeScript Check
        working-directory: services/openclaw-gateway
        run: npx tsc --noEmit

  build-deploy:
    name: Build & Deploy
    needs: typecheck-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker
        run: gcloud auth configure-docker asia-east1-docker.pkg.dev --quiet

      - name: "Build Docker Image (D-03: context=root)"
        run: |
          docker build \
            --tag ${{ env.IMAGE }}:${{ github.sha }} \
            --tag ${{ env.IMAGE }}:latest \
            --build-arg BUILD_SHA=${{ github.sha }} \
            --file services/openclaw-gateway/Dockerfile \
            .

      - name: "Run Trivy Scan (D-05)"
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'HIGH,CRITICAL'

      - name: Upload Trivy Results
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Push Image
        run: |
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: '--allow-unauthenticated'
          env_vars: |
            NODE_ENV=production
            PORT=3100
