name: Deploy OpenClaw Gateway

on:
  push:
    branches: [main]
    paths:
      - 'services/openclaw-gateway/**'
      - 'packages/types/**'
  workflow_dispatch:
    inputs:
      force_deploy:
        description: 'Force deploy even without path changes'
        type: boolean
        default: false

env:
  PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
  REGION: asia-east1
  SERVICE_NAME: openclaw-gateway
  IMAGE: asia-east1-docker.pkg.dev/${{ secrets.FIREBASE_PROJECT_ID }}/openclaw/gateway

jobs:
  typecheck-test:
    name: TypeScript & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install -g npm@latest
          npm install --legacy-peer-deps
        working-directory: services/openclaw-gateway

      - name: Build types
        run: npm run build
        working-directory: packages/types

      - name: Type check & Test
        run: |
          npm run build
          npm test
        working-directory: services/openclaw-gateway

  build-deploy:
    name: Build & Deploy
    needs: typecheck-test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Google Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.GCP_SA_KEY }}'

      - name: 'Set up Cloud SDK'
        uses: 'google-github-actions/setup-gcloud@v2'

      - name: 'Docker auth'
        run: |-
          gcloud auth configure-docker asia-east1-docker.pkg.dev

      - name: Build and Push Container
        run: |-
          docker build -t "${{ env.IMAGE }}:${{ github.sha }}" -f services/openclaw-gateway/Dockerfile .
          docker push "${{ env.IMAGE }}:${{ github.sha }}"
          docker tag "${{ env.IMAGE }}:${{ github.sha }}" "${{ env.IMAGE }}:latest"
          docker push "${{ env.IMAGE }}:latest"

      - name: Deploy to Cloud Run
        uses: 'google-github-actions/deploy-cloudrun@v2'
        with:
          service: '${{ env.SERVICE_NAME }}'
          image: '${{ env.IMAGE }}:${{ github.sha }}'
          region: '${{ env.REGION }}'
          env_vars: |
            NODE_ENV=production
